name: Build & Package pgModeler (v2.x)

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build with'
        required: true
        default: '6.8.0'
        type: choice
        options:
          - '6.8.0'
          - '6.7.3'
          - '6.6.3'
  push:
    tags:
      - 'v*'

jobs:
  # ─── Linux → AppImage ────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev libxml2-dev libxkbcommon-dev libgl1-mesa-dev \
            fuse libfuse2 patchelf file libcups2-dev imagemagick

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || '6.8.0' }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPGM_PREFIX=${{ github.workspace }}/AppDir/usr

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Install into AppDir
        run: cmake --install build

      - name: Prepare AppImage assets
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/pgmodeler.desktop << 'EOF'
          [Desktop Entry]
          Name=pgModeler
          Comment=PostgreSQL Database Modeler
          Exec=pgmodeler
          Icon=pgmodeler
          Terminal=false
          Type=Application
          Categories=Development;Database;
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert apps/pgmodeler/res/pgmodeler.ico[0] \
            AppDir/usr/share/icons/hicolor/256x256/apps/pgmodeler.png || \
          convert -size 256x256 xc:#336699 \
            -fill white -gravity center -pointsize 48 -annotate 0 "pgM" \
            AppDir/usr/share/icons/hicolor/256x256/apps/pgmodeler.png

      - name: Create AppRun wrapper
        run: |
          # pgModeler v2 uses $APPDIR to find resources, but it expects them at
          # $APPDIR/schemas, $APPDIR/conf etc. — not $APPDIR/usr/schemas.
          # This AppRun script sets the env vars to the correct bundled paths.
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PGMODELER_SCHEMAS_PATH="$HERE/usr/schemas"
          export PGMODELER_CONF_PATH="$HERE/usr/conf"
          export PGMODELER_TMPL_CONF_PATH="$HERE/usr/conf"
          export PGMODELER_LANG_PATH="$HERE/usr/lang"
          export PGMODELER_PLUGINS_PATH="$HERE/usr/lib/pgmodeler/plugins"
          export PGMODELER_SAMPLES_PATH="$HERE/usr/samples"
          export PGMODELER_CH_PATH="$HERE/usr/bin/pgmodeler-ch"
          export PGMODELER_CLI_PATH="$HERE/usr/bin/pgmodeler-cli"
          export PGMODELER_SE_PATH="$HERE/usr/bin/pgmodeler-se"
          export PGMODELER_TMP_PATH="${XDG_RUNTIME_DIR:-/tmp}/pgmodeler-tmp"
          mkdir -p "$PGMODELER_TMP_PATH"
          exec "$HERE/usr/bin/pgmodeler" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(which qmake)
          export LD_LIBRARY_PATH=$Qt6_DIR/lib:$LD_LIBRARY_PATH
          export VERSION=$(grep -m1 'project(pgmodeler VERSION' CMakeLists.txt | grep -oP '[\d.]+')
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/pgmodeler.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/pgmodeler.png
          # Rename whatever AppImage was created (case-insensitive match)
          find . -maxdepth 1 -iname "*.AppImage" ! -name "linuxdeploy*" \
            -exec mv {} pgmodeler-$VERSION-linux-x86_64.AppImage \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-linux-appimage
          path: pgmodeler-*-linux-x86_64.AppImage
          retention-days: 30

  # ─── macOS → DMG ─────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          brew install postgresql@17
          PGSQL_ROOT=$(brew --prefix postgresql@17)
          # Put pg_config on PATH immediately so we can use it
          export PATH="$PGSQL_ROOT/bin:$PATH"
          echo "$PGSQL_ROOT/bin" >> $GITHUB_PATH
          PGSQL_INC=$(pg_config --includedir)
          PGSQL_LIBDIR=$(pg_config --libdir)
          # Debug: show all dylibs available
          echo "All dylibs in libdir ($PGSQL_LIBDIR):"
          find "$PGSQL_LIBDIR" -maxdepth 2 -name "*.dylib" | head -20
          # Find libpq dylib (exact name first, then versioned, excluding plugins)
          PGSQL_DYLIB=$(find "$PGSQL_LIBDIR" -maxdepth 2 -name "libpq.dylib" | head -1)
          if [ -z "$PGSQL_DYLIB" ]; then
            PGSQL_DYLIB=$(find "$PGSQL_LIBDIR" -maxdepth 2 -name "libpq.*.dylib" | grep -v walreceiver | sort | tail -1)
          fi
          echo "PGSQL_INC=$PGSQL_INC" >> $GITHUB_ENV
          echo "PGSQL_DYLIB=$PGSQL_DYLIB" >> $GITHUB_ENV
          echo "PG inc: $PGSQL_INC"
          echo "PG dylib: $PGSQL_DYLIB"

      - name: Patch DefaultPaths.cmake for brew PostgreSQL
        run: |
          sed -i.bak "s|/Library/PostgreSQL/17/include|${PGSQL_INC}|g" DefaultPaths.cmake
          sed -i.bak "s|/Library/PostgreSQL/17/lib/libpq.dylib|${PGSQL_DYLIB}|g" DefaultPaths.cmake
          echo "Patched paths:"
          grep -E "(PGSQL_INC|PGSQL_LIBS)" DefaultPaths.cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || '6.8.0' }}

      - name: Configure
        run: |
          XML_SDK=$(xcrun --show-sdk-path)
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DXML2_INC="$XML_SDK/usr/include/libxml2" \
            -DXML2_LIBS="$XML_SDK/usr/lib/libxml2.tbd"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Install into app bundle
        run: cmake --install build

      - name: Package DMG
        run: |
          VERSION=$(grep -m1 'project(pgmodeler VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          macdeployqt /Applications/pgModeler.app -dmg -verbose=1
          mv /Applications/pgModeler.dmg pgmodeler-$VERSION-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-macos-dmg
          path: pgmodeler-*-macos.dmg
          retention-days: 30

  # ─── Windows → NSIS Installer ────────────────────────────────────────────────
  build-windows:
    name: Windows (NSIS Installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-tools

      - name: Configure
        run: |
          GCC=$(cygpath -w $(which gcc))
          GPP=$(cygpath -w $(which g++))
          echo "Using GCC: $GCC"
          echo "Using G++: $GPP"
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$GCC" \
            -DCMAKE_CXX_COMPILER="$GPP" \
            -DPGM_PREFIX=$(cygpath -m $GITHUB_WORKSPACE/install)

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Install
        run: cmake --install build

      - name: Bundle Qt DLLs
        run: |
          INSTALL=$(cygpath -m $GITHUB_WORKSPACE/install)
          EXE=$(find "$INSTALL" -name "pgmodeler.exe" | head -1)
          windeployqt6 --release "$EXE"

      - name: Copy MinGW runtime DLLs
        run: |
          INSTALL=$GITHUB_WORKSPACE/install
          MINGW_BIN=/mingw64/bin
          TMPFILE=$(mktemp)
          for pass in 1 2; do
            find "$INSTALL" \( -name "*.exe" -o -name "*.dll" \) -print0 | \
              xargs -0 -I{} ldd "{}" 2>/dev/null | \
              grep "$MINGW_BIN" | awk '{print $3}' | sort -u > "$TMPFILE" || true
            while IFS= read -r dll; do
              [ -z "$dll" ] && continue
              base=$(basename "$dll")
              if [ ! -f "$INSTALL/$base" ]; then
                echo "Copying $base"
                cp "$dll" "$INSTALL/" 2>/dev/null || true
              fi
            done < "$TMPFILE"
          done
          rm -f "$TMPFILE"
          echo "DLL copy complete"

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(grep -m1 'project(pgmodeler VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')" >> $GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installDir = "${{ github.workspace }}\install"
          Compress-Archive -Path "$installDir\*" -DestinationPath "pgmodeler-$version-windows-x86_64-portable.zip"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-windows-portable
          path: pgmodeler-*-windows-x86_64-portable.zip
          retention-days: 30

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installDir = "${{ github.workspace }}\install"
          $nsis = @"
          Unicode True
          !define APPNAME "pgModeler"
          !define VERSION "$version"

          Name "`${APPNAME} `${VERSION}"
          OutFile "pgmodeler-$version-windows-x86_64-installer.exe"
          InstallDir "`$PROGRAMFILES64\pgModeler"
          InstallDirRegKey HKLM "Software\pgModeler" "InstallDir"
          RequestExecutionLevel admin

          Section "pgModeler"
            SetOutPath "`$INSTDIR"
            File /r "$installDir\*"
            CreateShortcut "`$DESKTOP\pgModeler.lnk" "`$INSTDIR\pgmodeler.exe"
            CreateDirectory "`$SMPROGRAMS\pgModeler"
            CreateShortcut "`$SMPROGRAMS\pgModeler\pgModeler.lnk" "`$INSTDIR\pgmodeler.exe"
            CreateShortcut "`$SMPROGRAMS\pgModeler\Uninstall.lnk" "`$INSTDIR\Uninstall.exe"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\pgModeler" "DisplayName" "pgModeler $version"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\pgModeler" "UninstallString" "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$DESKTOP\pgModeler.lnk"
            RMDir /r "`$SMPROGRAMS\pgModeler"
            RMDir /r "`$INSTDIR"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\pgModeler"
          SectionEnd
          "@
          $nsis | Out-File -FilePath installer.nsi -Encoding UTF8
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-windows-installer
          path: pgmodeler-*-windows-x86_64-installer.exe
          retention-days: 30

  # ─── Summary ─────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "## pgModeler v2.x Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux (AppImage) | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS (DMG) | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (NSIS + Portable ZIP) | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY

  # ─── GitHub Release (tag pushes only) ────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
